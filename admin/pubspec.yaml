name: matricquest_admin
description: "MatricQuest SA — staff content administration dashboard (section 12)."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter

  # State management & navigation — plain (non-codegen) Riverpod, same reasoning as app/pubspec.yaml.
  flutter_riverpod: ^2.6.1
  go_router: ^15.1.2

  # Backend
  supabase_flutter: ^2.8.0

  # Misc utilities
  intl: ^0.20.2
  uuid: ^4.5.1
  file_picker: ^8.1.6
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
